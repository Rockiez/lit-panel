name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify release inputs
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
          python3 scripts/build_dist.py --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/validate_readme.py
          python3 scripts/release_check.py
      - name: Package host-specific distributions
        run: |
          version="${GITHUB_REF_NAME}"
          for host in codex claude antigravity; do
            tar -C "dist/${host}" -czf "lit-panel-${host}-${version}.tar.gz" .
          done
          sha256sum lit-panel-*.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" lit-panel-*.tar.gz SHA256SUMS --generate-notes
